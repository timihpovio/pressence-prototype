      - figure [ref=f13e20]:
        - img "Gorska pot, ki se vije med sončnimi griči" [ref=f13e21]
    - generic [ref=f13e23]:
      - generic [ref=f13e24]:
        - paragraph [ref=f13e25]: Prehodna obdobja so neprijetna prav zato, ker staro ni več pravo, novo pa še nima jasne oblike.
        - paragraph [ref=f13e26]: Morda naloga tega obdobja ni, da čim prej najdemo odgovor.
        - heading "Prostor med starim in novim" [level=2] [ref=f13e27]
        - paragraph [ref=f13e28]: Včasih imamo občutek, da bi morali vedeti, kam gremo.
        - paragraph [ref=f13e29]: Da bi morali imeti načrt. Odločitev. Jasno smer.
        - paragraph [ref=f13e30]: In vendar je edino, kar je na voljo, prostor med dvema točkama.
        - paragraph [ref=f13e31]: Ta prostor je pogosto neprijeten, ker ga ne moremo pojasniti drugim. Ko nas kdo vpraša, kaj sledi, nimamo dobrega odgovora. In ker ga nimamo, se nam zdi, da nekaj delamo narobe.
        - paragraph [ref=f13e32]: Morda pa ne delamo nič narobe.
        - paragraph [ref=f13e33]: Morda smo samo sredi nečesa, kar še ni dobilo oblike.
        - paragraph [ref=f13e34]: Kaj v tej situaciji opazite pri sebi, ko odgovora ni?
        - heading "Zakaj hitimo k odgovoru" [level=2] [ref=f13e35]
        - paragraph [ref=f13e36]: Negotovost je neprijetna, zato jo pogosto poskušamo zapreti.
        - paragraph [ref=f13e37]: Sprejmemo prvo možnost, ki se zdi dovolj razumna. Vrnemo se k nečemu znanemu. Ali pa se zaposlimo tako, da o tem ni več časa razmišljati.
        - paragraph [ref=f13e38]: Vse to deluje, ampak samo za nekaj časa.
        - paragraph [ref=f13e39]: Odločitev, sprejeta zato, da se negotovost konča, običajno ni odločitev, ki bi zares odgovarjala na vprašanje.
        - paragraph [ref=f13e40]: Zato se isto vprašanje pogosto vrne, le v drugačni obleki.
        - heading "Kaj lahko naredimo namesto tega" [level=2] [ref=f13e41]
        - paragraph [ref=f13e42]: Ni treba, da prehodno obdobje takoj razrešimo.
        - paragraph [ref=f13e43]: Lahko ga samo opazujemo dovolj dolgo, da začnemo prepoznavati, kaj se v njem pravzaprav dogaja.
        - paragraph [ref=f13e44]: Kaj se je izteklo. Kaj še ni. Kaj nas privlači, tudi če tega še ne znamo pojasniti.
        - paragraph [ref=f13e45]: To ni pasivnost. Je pozornost.
        - heading "Nekaj za razmislek" [level=2] [ref=f13e46]
        - paragraph [ref=f13e47]: Na koncu ni treba ponuditi petih korakov ali univerzalne rešitve.
        - paragraph [ref=f13e48]: Dovolj je eno dobro vprašanje.
        - paragraph [ref=f13e49]: Kaj bi se spremenilo, če vam v tem obdobju ne bi bilo treba že vedeti, kaj sledi?
